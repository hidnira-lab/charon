name: Draft Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'
      sequence:
        description: 'Monotonic release sequence integer'
        required: true
        default: '1'

permissions:
  contents: write

jobs:
  build-and-draft:
    name: Build Windows & Server Artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Go modules (core, windows service, charonsync)
        shell: pwsh
        run: |
          Push-Location v2/core
          go test -race ./...
          Pop-Location
          Push-Location v2/platform/windows
          go test -race ./...
          Pop-Location
          Push-Location v2/server/charonsync
          go test -race ./...
          Pop-Location

      - name: Package release artifacts and unsigned manifest.json
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) {
            $ver = "${{ github.ref_name }}".TrimStart('v')
          }
          $seq = "${{ github.event.inputs.sequence }}"
          if (-not $seq) {
            $seq = "1"
          }
          ./v2/scripts/package-release.ps1 -Version $ver -Sequence ([uint64]$seq)

      - name: Create Draft GitHub Release (awaiting offline Ed25519 manifest signature)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            v2/dist/charon-windows-amd64.zip
            v2/dist/charonsync-windows-amd64.exe
            v2/dist/charonsync-linux-amd64
            v2/dist/manifest.json
